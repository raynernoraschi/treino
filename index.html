<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Meu Treino</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" hidden>
  <form id="loginForm" class="card login-card" autocomplete="on">
    <h1>🏋️ Meu Treino</h1>
    <p class="muted">Digite sua senha para entrar.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Senha" required>
    <button class="btn primary" type="submit">Entrar</button>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <strong>🏋️ Meu Treino</strong>
    <button id="logout" class="btn ghost sm" type="button">Sair</button>
  </header>
  <div id="warn" class="warn" hidden>⚠️ Você ainda está usando a senha padrão. Troque em <code>config.php</code>.</div>
  <main id="view"></main>
  <nav id="nav">
    <button data-tab="treino"><span>🏋️</span>Treino</button>
    <button data-tab="editar"><span>✏️</span>Exercícios</button>
    <button data-tab="stats"><span>📊</span>Estatísticas</button>
    <button data-tab="hist"><span>🗒️</span>Histórico</button>
  </nav>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
